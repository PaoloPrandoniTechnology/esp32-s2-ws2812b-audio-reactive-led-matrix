; ============================================================
; tools/usb-test/platformio.ini  — PROGETTO MINIMO DI TEST USB
; ------------------------------------------------------------
; Obiettivo: solo Serial.begin() + blink LED_BUILTIN + println
; per verificare se la USB CDC si enumera in Windows a runtime
; SENZA toccare WiFi, LittleFS, I2S, librerie esterne.
; ============================================================

[env:lolin_s2_mini]
platform = espressif32@6.3.1
board = lolin_s2_mini
framework = arduino
monitor_speed = 115200

; Stesse identiche opzioni USB del progetto principale (riga unica!)
board_build.arduino_usb_cdc_on_boot = yes
build_flags = -DARDUINO_USB_MODE=0 -DARDUINO_USB_CDC_ON_BOOT=1 -DLED_BUILTIN_ACTIVELOW=1

upload_speed = 921600
board_upload.use_1200bps_touch = yes
board_upload.wait_for_upload_port = yes

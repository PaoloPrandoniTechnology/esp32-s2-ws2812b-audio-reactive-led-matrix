[env:lolin_s2_mini]
platform = espressif32@6.3.1
board = lolin_s2_mini
framework = arduino
monitor_speed = 115200

; NOTE SULLE OPZIONI USB (2026-10-06):
;   board_build.arduino_usb_cdc_on_boot = yes  -> crea -DARDUINO_USB_CDC_ON_BOOT=1 (OK)
;   board_build.arduino_usb_mode = xxx        -> NON crea -DARDUINO_USB_MODE=0 con espressif32@6.3.1!
; Per sicurezza aggiungiamo -DARDUINO_USB_MODE=0 MANUALMENTE in build_flags.
; Inoltre build_flags in formato multi-riga non viene applicato (bug parsing Windows PIO 6.1.18):
; mantenere TUTTO su UNA SOLA RIGA. NON aggiungere nuove righe indentate sotto build_flags!
board_build.arduino_usb_cdc_on_boot = yes
build_flags = -Wall -Wextra -DARDUINO_USB_MODE=0 -DARDUINO_USB_CDC_ON_BOOT=1 -DCORE_DEBUG_LEVEL=3 -DLED_BUILTIN_ACTIVELOW=1 -DBOARD_HAS_PSRAM -Iinclude

; ============================================================
; Aggiornamento OTA via WiFi (ArduinoOTA built-in, oltre alla pagina web /update)
; ============================================================
; Dopo il primo flash via USB, puoi flashare via WiFi con PlatformIO
; (sostituisci <IP_ESP> e <PWD_OTA> con IP corrente e AP_PASSWORD da include/config.h):
;   pio run -t upload   --upload-port <IP_ESP>  --upload-protocol espota  --upload-auth=<PWD_OTA>
;   pio run -t uploadfs --upload-port <IP_ESP>  --upload-protocol espota  --upload-auth=<PWD_OTA>
; DEFAULT: porta 3232, password = AP_PASSWORD in config.h (es. "12345678").
; Esempio reale:
;   pio run -t upload --upload-port 192.168.0.71 --upload-protocol espota --upload-auth=12345678
;
; Per abilitare l'OTA nel firmware: ENDPOINT WEB /update già IMPLEMENTATO in main.cpp
; (upload multipart .bin tipo firmware o littlefs). NON serve alcuna libreria esterna:
; Update.h + WiFi.h sono gia' inclusi in framework-arduinoespressif32 built-in.

; --- Opzione PlatformIO OTA via espota (commentata di default, scommenta e setta IP per usarla):
; upload_protocol = espota
; upload_port    = 192.168.0.71
; upload_auth    = 12345678

lib_deps =
    ottowinter/ESPAsyncWebServer-esphome@^3.3.2
    bblanchon/ArduinoJson@^7.2.0
    fastled/FastLED@3.5.0
    ; NOTA: ArduinoOTA NON serve come lib_deps esterna: e' built-in in framework-arduinoespressif32
    ; tramite Update.h e la classe ArduinoOTA.h del core. NON scommentare riga sotto:
    ; arduino-libraries/ArduinoOTA@^1.4.1   <- NON ESISTE nel registry PIO!
    ; NOTA FastLED: fissata a 3.5.0 per incompatibilita' ESP32-S2 + IDF 4.4.4:
    ; FastLED 3.6.0 introduce fl:: (FL namespace) con ADC_WIDTH_BIT_12 non esistente
    ; su ESP32-S2 (solo ADC_WIDTH_BIT_13 disponibile). Bug confermato in
    ; pin_esp32_native_impl.hpp ADC init.
board_build.partitions = default.csv
board_build.filesystem = littlefs
upload_speed = 921600
board_upload.use_1200bps_touch = yes
board_upload.wait_for_upload_port = yes

; --- Opzioni commentate (non eliminate per regola progetto: commenta invece di cancellare) ---
; ----- Rimosse/commentate per bug non funzionanti o ridondanti -----
; build_unflags =
;     -DARDUINO_USB_MODE=1
;     -DARDUINO_USB_CDC_ON_BOOT=0
; board_build.arduino_usb_mode = hardware_cdc   ; NON genera -DARDUINO_USB_MODE=0 in esp32@6.3.1
; board_build.arduino_usb_mode = tinyusb_device ; NON genera -DARDUINO_USB_MODE=0 in esp32@6.3.1
; board_build.arduino_usb_mode = arduino_tinyusb; NON genera -DARDUINO_USB_MODE=0 in esp32@6.3.1
; ----- END opzioni commentate -----
